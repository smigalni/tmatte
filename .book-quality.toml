# Bokspesifikke innstillinger; kontrollprogrammet deles mellom bok-repoene.
[checks]
example_heading_requires_box = true
answer_requires_double_underline = true
answer_key_requires_double_underline = true
check_admonition_indentation = true
check_balanced_code_fences = true
check_balanced_svg_figure = true
# Elevheftet er uten fasit; lærerheftet gjentar oppgavene og inneholder fasit.
# Sammenligningen mellom heftene kontrolleres separat, siden sjekkeren validerer én fil om gangen.
check_task_answer_pairing = false
answer_marker = '^\s*\*\*Svar:\*\*'
answer_search_lines = 12
excluded_paths = ["site/", "build/", ".venv/", ".book-quality-tools/"]
